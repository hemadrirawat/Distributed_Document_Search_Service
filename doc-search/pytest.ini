[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Integration tests need the docker-compose stack; opt in with `pytest -m integration`.
addopts = -m "not integration"
markers =
    integration: requires the docker-compose stack (Postgres, Redis, OpenSearch, RabbitMQ)
filterwarnings =
    ignore::DeprecationWarning
